name: Build

on:
  push:
    branches: [ main, feat/sync-pin ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build 1.7.10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Make gradlew executable
        working-directory: 1.7.10
        run: chmod +x gradlew

      - name: Setup workspace
        working-directory: 1.7.10
        run: ./gradlew setupCIWorkspace --no-daemon --console=plain --stacktrace

      - name: Build
        working-directory: 1.7.10
        run: ./gradlew build --no-daemon --console=plain --stacktrace

      - name: Show artifacts
        working-directory: 1.7.10
        run: ls -l build/libs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pin-1.7.10
          path: 1.7.10/build/libs/*.jar
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pin-1.7.10
          path: dist

      - name: List files
        run: ls -l dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*.jar
          generate_release_notes: true
